services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe-code-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vibecode
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: vibe-code-piston
    restart: unless-stopped
    privileged: true   # 👈 Required for Piston isolate/cgroup sandbox
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston/packages
    tmpfs:
      - /tmp:exec,size=512m
    ulimits:
      nproc: 512
      nofile:
        soft: 65536
        hard: 65536
volumes:
  postgres_data:
  piston_data:
